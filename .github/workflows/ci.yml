name: FinFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APP_ENV: development
      SECRET_KEY: ci-test-secret-key
      UV_PYTHON_DOWNLOADS: never
      UV_LINK_MODE: copy
      UV_HTTP_TIMEOUT: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          echo "Using Python: $(python --version) at $(which python)"
          uv sync --frozen --group test

      - name: Run unit tests
        run: uv run pytest tests/ -v

  backend-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          source scripts/ci-docker-retry.sh
          mirror_base_images
          docker build -t finflow-api:ci .

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build frontend Docker image
        working-directory: ${{ github.workspace }}
        run: |
          source scripts/ci-docker-retry.sh
          mirror_base_images
          docker build -f frontend/Dockerfile -t finflow-frontend:ci .

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend-tests, frontend-build]
    env:
      SECRET_KEY: ci-e2e-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        timeout-minutes: 30
        run: |
          set -euo pipefail
          source scripts/ci-docker-retry.sh
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml"
          pull_compose_images $COMPOSE
          mirror_base_images

          $COMPOSE up -d postgres redis zookeeper kafka qdrant minio
          for i in $(seq 1 60); do
            if $COMPOSE exec -T postgres pg_isready -U finflow -d finflow_db >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          export COMPOSE
          bash scripts/ensure-temporal-databases.sh

          $COMPOSE up -d --build temporal
          temporal_ready=0
          for i in $(seq 1 60); do
            if $COMPOSE exec -T temporal tctl --address 127.0.0.1:7233 cluster health >/dev/null 2>&1; then
              echo "Temporal is ready"
              temporal_ready=1
              break
            fi
            sleep 5
          done
          if [ "$temporal_ready" != "1" ]; then
            echo "Temporal failed to become healthy"
            $COMPOSE logs temporal --tail 120
            exit 1
          fi

          $COMPOSE up -d --build api frontend
          for i in $(seq 1 90); do
            temporal_ok=0
            api_ok=0
            ui_ok=0
            curl -sf http://localhost:8000/live >/dev/null && api_ok=1
            curl -sf http://localhost:8088/ >/dev/null && ui_ok=1
            $COMPOSE exec -T temporal tctl --address 127.0.0.1:7233 cluster health >/dev/null 2>&1 && temporal_ok=1
            echo "Waiting for stack (${i}/90): api=${api_ok} ui=${ui_ok} temporal=${temporal_ok}"
            if [ "$api_ok" = "1" ] && [ "$ui_ok" = "1" ] && [ "$temporal_ok" = "1" ]; then
              echo "Stack is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Stack failed to become healthy"
          $COMPOSE ps -a
          $COMPOSE logs temporal --tail 80
          $COMPOSE logs api --tail 40
          exit 1

      - name: Seed database
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml"
          $COMPOSE exec -T api uv run alembic upgrade head
          $COMPOSE exec -T api uv run python scripts/generate_synthetic_data.py
          $COMPOSE exec -T api uv run python scripts/seed_database.py --reset

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run E2E smoke tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8088
        run: npm test
