name: FinFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow123
          POSTGRES_DB: finflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finflow -d finflow_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://finflow:finflow123@localhost:5432/finflow_db
      DATABASE_SYNC_URL: postgresql://finflow:finflow123@localhost:5432/finflow_db
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: development
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run unit tests
        run: uv run pytest tests/ -v

      - name: Build backend Docker image
        run: docker build -t finflow-api:ci .

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build frontend Docker image
        working-directory: ..
        run: docker build -f frontend/Dockerfile -t finflow-frontend:ci .
