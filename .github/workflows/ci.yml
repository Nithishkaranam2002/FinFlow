name: FinFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow123
          POSTGRES_DB: finflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finflow -d finflow_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: minio/minio:RELEASE.2024-12-18T13-15-44Z
        env:
          MINIO_ROOT_USER: finflow
          MINIO_ROOT_PASSWORD: finflow123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        command: server /data

    env:
      DATABASE_URL: postgresql+asyncpg://finflow:finflow123@localhost:5432/finflow_db
      DATABASE_SYNC_URL: postgresql://finflow:finflow123@localhost:5432/finflow_db
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: finflow
      S3_SECRET_KEY: finflow123
      S3_BUCKET: finflow-documents
      APP_ENV: development
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run unit tests
        run: uv run pytest tests/ -v

      - name: Build backend Docker image
        run: docker build -t finflow-api:ci .

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build frontend Docker image
        working-directory: ${{ github.workspace }}
        run: docker build -f frontend/Dockerfile -t finflow-frontend:ci .

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    env:
      SECRET_KEY: ci-e2e-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml"

          $COMPOSE up -d postgres redis zookeeper kafka qdrant minio
          for i in $(seq 1 60); do
            if $COMPOSE exec -T postgres pg_isready -U finflow -d finflow_db >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          export COMPOSE
          bash scripts/ensure-temporal-databases.sh

          $COMPOSE up -d --build temporal
          temporal_ready=0
          for i in $(seq 1 60); do
            if $COMPOSE exec -T temporal tctl --address 127.0.0.1:7233 cluster health >/dev/null 2>&1; then
              echo "Temporal is ready"
              temporal_ready=1
              break
            fi
            sleep 5
          done
          if [ "$temporal_ready" != "1" ]; then
            echo "Temporal failed to become healthy"
            $COMPOSE logs temporal --tail 120
            exit 1
          fi

          $COMPOSE up -d --build
          for i in $(seq 1 90); do
            temporal_ok=0
            api_ok=0
            ui_ok=0
            curl -sf http://localhost:8000/live >/dev/null && api_ok=1
            curl -sf http://localhost:8088/ >/dev/null && ui_ok=1
            $COMPOSE exec -T temporal tctl --address 127.0.0.1:7233 cluster health >/dev/null 2>&1 && temporal_ok=1
            if [ "$api_ok" = "1" ] && [ "$ui_ok" = "1" ] && [ "$temporal_ok" = "1" ]; then
              echo "Stack is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Stack failed to become healthy"
          $COMPOSE ps -a
          $COMPOSE logs temporal --tail 80
          $COMPOSE logs api --tail 40
          exit 1

      - name: Seed database
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml"
          $COMPOSE exec -T api uv run alembic upgrade head
          $COMPOSE exec -T api uv run python scripts/seed_database.py --reset

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run E2E smoke tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8088
        run: npm test
