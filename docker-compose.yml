name: finflow

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - finflow-network
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://finflow:finflow123@postgres:5432/finflow_db
    DATABASE_SYNC_URL: postgresql://finflow:finflow123@postgres:5432/finflow_db
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    QDRANT_URL: http://qdrant:6333
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: finflow
    S3_SECRET_KEY: finflow123
    S3_BUCKET: finflow-documents
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_ENABLED: "true"
    APP_ENV: development
    LOG_LEVEL: debug
    CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088
    USE_POSTGRES_CHECKPOINTER: "false"
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
    LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://us.cloud.langfuse.com}}
  volumes:
    - .:/app
    - api_venv:/app/.venv
  working_dir: /app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    zookeeper:
      condition: service_healthy
    kafka:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    minio:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1G
      reservations:
        cpus: "0.25"
        memory: 512M

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finflow-postgres
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: finflow_db
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: finflow-redis
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: finflow-zookeeper
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: finflow-kafka
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:29092",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: finflow-kafka-ui
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: finflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: finflow-qdrant
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \"200\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: finflow-minio
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: finflow
      MINIO_ROOT_PASSWORD: finflow123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: finflow-temporal
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: finflow
      POSTGRES_PWD: finflow123
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: "0.0.0.0"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "127.0.0.1:7233", "cluster", "health"]
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 180s

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: finflow-temporal-ui
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "8233:8080"
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finflow-api
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://finflow:finflow123@postgres:5432/finflow_db
      DATABASE_SYNC_URL: postgresql://finflow:finflow123@postgres:5432/finflow_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: finflow
      S3_SECRET_KEY: finflow123
      S3_BUCKET: finflow-documents
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_ENABLED: "true"
      APP_ENV: development
      LOG_LEVEL: debug
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088
      USE_POSTGRES_CHECKPOINTER: "false"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://us.cloud.langfuse.com}}
    volumes:
      - .:/app
      - api_venv:/app/.venv
    working_dir: /app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  invoice-worker:
    <<: *worker-base
    container_name: finflow-invoice-worker
    profiles: ["legacy-kafka"]
    command: ["uv", "run", "python", "-m", "workers.invoice_worker"]

  reconciliation-worker:
    <<: *worker-base
    container_name: finflow-reconciliation-worker
    command: ["uv", "run", "python", "-m", "workers.reconciliation_worker"]

  temporal-worker:
    <<: *worker-base
    container_name: finflow-temporal-worker
    command: ["python", "-m", "workers.temporal_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: finflow-frontend
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  finflow-network:
    name: finflow-network
    driver: bridge

volumes:
  postgres_data:
    name: finflow-postgres-data
  redis_data:
    name: finflow-redis-data
  zookeeper_data:
    name: finflow-zookeeper-data
  zookeeper_log:
    name: finflow-zookeeper-log
  kafka_data:
    name: finflow-kafka-data
  api_venv:
    name: finflow-api-venv
  qdrant_data:
    name: finflow-qdrant-data
  minio_data:
    name: finflow-minio-data
