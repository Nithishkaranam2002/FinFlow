[project]
name = "finflow"
version = "0.1.0"
description = "Agentic invoice-to-reconciliation platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Core framework
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.20",
    # AI and agents
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.1",
    "litellm>=1.57.4",
    "mem0ai>=0.1.48",
    "langfuse>=2.57.5",
    "openai>=1.59.6",
    "anthropic>=0.42.0",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "greenlet>=3.1.1",
    "pgvector>=0.3.6",
    # Kafka and Redis
    "aiokafka>=0.12.0",
    "redis>=5.2.1",
    "celery>=5.4.0",
    # Data processing
    "pandas>=2.2.3",
    "numpy>=2.2.1",
    "rapidfuzz>=3.11.0",
    "imagehash>=4.3.2",
    "Pillow>=11.1.0",
    "pdf2image>=1.17.0",
    "scikit-learn>=1.6.0",
    "faker>=33.1.0",
    # Utilities
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "httpx>=0.28.1",
    "resend>=2.6.0",
]

[dependency-groups]
dev = [
    "deepeval>=2.1.6",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "core", "models", "schemas", "services", "workers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
