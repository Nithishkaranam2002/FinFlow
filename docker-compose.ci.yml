name: finflow-ci

services:
  api:
    environment:
      SECRET_KEY: ci-e2e-secret-key
      USE_POSTGRES_CHECKPOINTER: "false"
    command:
      [
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]

  temporal-worker:
    environment:
      USE_POSTGRES_CHECKPOINTER: "false"
