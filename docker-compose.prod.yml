name: finflow-prod

services:
  api:
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: info
      USE_POSTGRES_CHECKPOINTER: "true"
      CORS_ORIGINS: http://localhost:8088,http://localhost
      APP_BASE_URL: http://localhost:8088
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY for production}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://us.cloud.langfuse.com}}
    volumes: []
    command:
      [
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
      ]

  invoice-worker:
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: info
      USE_POSTGRES_CHECKPOINTER: "true"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://us.cloud.langfuse.com}}
    volumes: []

  reconciliation-worker:
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: info
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://us.cloud.langfuse.com}}
    volumes: []

  temporal-worker:
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: info
      USE_POSTGRES_CHECKPOINTER: "true"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://us.cloud.langfuse.com}}
    volumes: []

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: finflow-frontend
    restart: unless-stopped
    networks:
      - finflow-network
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
